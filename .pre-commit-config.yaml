#
# The repository's own gates, and the first consumer of its own hook: the
# `licensing` entry below is the one other repositories get from
# .pre-commit-hooks.yaml, run straight from the working tree.
# Tool versions are pinned in mise.toml. Setup:
#   mise install
#   pre-commit install --install-hooks -t pre-commit -t commit-msg -t pre-push
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=style, --external-sources]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, test, docs, build, ci, chore, style, revert]

  - repo: local
    hooks:
      - id: licensing
        name: licensing gate (this repository's own tree)
        entry: ./licensing.sh check --mode auto
        language: script
        always_run: true
        pass_filenames: false

      - id: docs-match-script
        name: README.md documents every setting, option, command, hook and file
        entry: scripts/check-docs.sh
        language: script
        files: '^(licensing\.sh|README\.md|\.pre-commit-hooks\.yaml|scripts/check-docs\.sh)$'
        pass_filenames: false

      - id: license-mirror
        name: LICENSE is the same text as LICENSES/MPL-2.0.txt
        description: >-
          LICENSE is the copy GitHub and people read, LICENSES/MPL-2.0.txt the
          copy reuse reads. reuse checks that a cited licence has a text, never
          that two copies agree, so this does.
        entry: cmp LICENSE LICENSES/MPL-2.0.txt
        language: system
        files: '^(LICENSE|LICENSES/MPL-2\.0\.txt)$'
        pass_filenames: false

      - id: version-matches-tag
        name: README.md pins one version, and on a tag it is the tag
        entry: scripts/check-version.sh
        language: script
        always_run: true
        pass_filenames: false

      - id: bats
        name: bats (licensing.sh behaviour tests)
        description: ~30 s; runs before a push and in CI, not on every commit.
        entry: bats tests
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
