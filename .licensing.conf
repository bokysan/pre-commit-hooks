#
# Policy for this repository's own run of licensing.sh (the hook is its own
# first consumer). The repository has no third-party dependencies, so the
# lists only matter when someone adds one: permissive and MPL in, copyleft out.

LICENSING_SCAN_TARGET="dir:."
LICENSING_ALLOW=(MIT MIT-0 BSD-2-Clause BSD-3-Clause Apache-2.0 ISC MPL-2.0 CC0-1.0 Unlicense 0BSD Zlib)
LICENSING_DENY=(GPL-2.0-only GPL-2.0-or-later GPL-3.0-only GPL-3.0-or-later AGPL-3.0-only AGPL-3.0-or-later LGPL-2.1-only LGPL-2.1-or-later LGPL-3.0-only LGPL-3.0-or-later CDDL-1.0 CDDL-1.1 EPL-1.0 EPL-2.0 SSPL-1.0 BUSL-1.1)
LICENSING_ALLOW_EXPRESSIONS=()
LICENSING_DENY_EXPRESSIONS=()
LICENSING_EXCEPTIONS=".license-exceptions.txt"
LICENSING_COPYRIGHT="2026 Bojan Čekrlić"
LICENSING_LICENSE="MPL-2.0"
LICENSING_DOC_LICENSE="CC-BY-4.0"
LICENSING_SYFT_VERSION="1.51.0"
# GitHub Actions workflows are build infrastructure and carry no licence metadata.
LICENSING_REVIEW_EXEMPT_TYPES=("github-action")
LICENSING_LOCAL_MODE="delta"
