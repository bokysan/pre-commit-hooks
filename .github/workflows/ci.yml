name: CI

# The CI. The job logic lives here and nowhere else.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (pre-commit, every hook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version gate asks git for the tag at HEAD
      - uses: jdx/mise-action@v2
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bats --print-output-on-failure tests

  hook:
    name: the published hook, run the way a consumer runs it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Consume this checkout as a pre-commit repo
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          cp .licensing.conf REUSE.toml mise.toml "$consumer/"
          cp -R LICENSES "$consumer/LICENSES"
          cd "$consumer"
          git init -q .
          cat > .pre-commit-config.yaml <<YAML
          repos:
            - repo: ${GITHUB_WORKSPACE}
              rev: HEAD
              hooks:
                - id: licensing
          YAML
          git -C "${GITHUB_WORKSPACE}" rev-parse HEAD >/dev/null
          rev="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          sed -i "s/rev: HEAD/rev: ${rev}/" .pre-commit-config.yaml
          git add -A
          pre-commit run licensing --all-files

  release:
    name: GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gates, test, hook]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version README.md tells users to pin
        run: scripts/check-version.sh "${GITHUB_REF_NAME}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
