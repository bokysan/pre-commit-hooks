name: CI

# The CI. The job logic lives here and nowhere else.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (pre-commit, every hook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version gate asks git for the tag at HEAD
      - uses: jdx/mise-action@v2
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bats --print-output-on-failure tests

  hook:
    name: the published hook, run the way a consumer runs it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Consume this checkout as a pre-commit repo
        run: |
          set -euo pipefail
          rev="$(git rev-parse HEAD)"
          consumer="$(mktemp -d)"
          cd "$consumer"
          git init -q .
          # A minimal compliant repository: a policy, and REUSE information for every file.
          printf 'LICENSING_ALLOW=(MIT)\nLICENSING_DENY=(GPL-3.0-only)\n' > .licensing.conf
          printf 'version = 1\n\n[[annotations]]\npath = "**"\nSPDX-FileCopyrightText = "2026 Example"\nSPDX-License-Identifier = "MPL-2.0"\n' > REUSE.toml
          mkdir LICENSES
          cp "${GITHUB_WORKSPACE}/LICENSES/MPL-2.0.txt" LICENSES/
          cp "${GITHUB_WORKSPACE}/mise.toml" .
          printf 'repos:\n  - repo: %s\n    rev: %s\n    hooks:\n      - id: licensing\n' "${GITHUB_WORKSPACE}" "${rev}" > .pre-commit-config.yaml
          git add -A
          pre-commit run licensing --all-files

  release:
    name: GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gates, test, hook]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version README.md tells users to pin
        run: scripts/check-version.sh "${GITHUB_REF_NAME}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
