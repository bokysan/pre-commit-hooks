name: CI

# The shared CI. GitHub runs it directly; the Forgejo wrapper in
# .forgejo/workflows/ci.yml calls it as a reusable workflow, so there is one copy
# of the job logic. A calling workflow defines its own `on:`, which a reusable
# workflow cannot inherit, so the triggers live in both files.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    name: gates (pre-commit, every hook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version gate asks git for the tag at HEAD
      - uses: jdx/mise-action@v2
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bats --print-output-on-failure tests

  hook:
    name: the published hook, run the way a consumer runs it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Consume this checkout as a pre-commit repo
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          cp .licensing.conf REUSE.toml mise.toml "$consumer/"
          cp -R LICENSES "$consumer/LICENSES"
          cd "$consumer"
          git init -q .
          cat > .pre-commit-config.yaml <<YAML
          repos:
            - repo: ${GITHUB_WORKSPACE}
              rev: HEAD
              hooks:
                - id: licensing
          YAML
          git -C "${GITHUB_WORKSPACE}" rev-parse HEAD >/dev/null
          rev="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          sed -i "s/rev: HEAD/rev: ${rev}/" .pre-commit-config.yaml
          git add -A
          pre-commit run licensing --all-files

  release-check:
    name: tag equals licensing.sh version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh "${GITHUB_REF_NAME}"
